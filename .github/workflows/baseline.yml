name: baseline
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
